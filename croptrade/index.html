<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Trade - FarmSyncro</title>
    <link rel="stylesheet" href="crop-trade.css">
</head>
<body>
    <nav>
        <div class="logo">
            <img src="/logo.jpeg" alt="FarmSyncro Logo">
        </div>
        <h1>FarmSyncro</h1>
    </nav>

    <section class="trade-options">
        <h2>Choose Your Role</h2>

        <div class="trade-buttons">
            <!-- Farmer button (image as button) -->
            <div class="button-container">
                <a href="./farmerpage/index.html">
                    <img src="/farmer.jpeg" alt="Farmer" class="button-img">
                    <p>Farmer</p>
                </a>
            </div>

            <!-- Buyer button (image as button) -->
            <div class="button-container">
                <a href="./buyerpage/index.html">
                    <img src="https://images.pexels.com/photos/27793717/pexels-photo-27793717/free-photo-of-people-are-standing-in-a-warehouse-with-tobacco.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2" alt="Buyer" class="button-img">
                    <p>Buyer</p>
                </a>
            </div>
        </div>
    </section>

    <script src="crop-trade.js"></script>
</body>
</html>
